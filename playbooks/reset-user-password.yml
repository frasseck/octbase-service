---
# Reset one Octbase *application* user's password directly in the client's
# database, for when the self-service flow cannot be used.
#
#   ansible-playbook playbooks/reset-user-password.yml -e client=acme \
#       -e email=someone@acme.ch
#
# The password is generated and printed once at the end of the run. To set a
# known one instead (it must still clear the app's policy):
#
#   ansible-playbook playbooks/reset-user-password.yml -e client=acme \
#       -e email=someone@acme.ch -e user_password='…'
#
# Why this exists: client stacks have no Mailpit and the password-reset mail
# goes to a real mailbox, so an operator who must restore access to a locked-out
# account has no way to read the token. This writes the same end state the app's
# own reset writes (auth/password_reset.go): new hash, every session ended, any
# pending reset token spent, one audit row. Nothing else about the account is
# touched.
#
# NOT covered on purpose:
#   * MFA. If the account is locked out by a lost authenticator, a new password
#     will not help — mfa_credentials/mfa_recovery_codes are a separate decision
#     and a separate playbook. The result message says so when MFA is on.
#   * Deactivated accounts. A reset on status != 'active' produces a working
#     password that still cannot log in; the run warns rather than reactivating,
#     because reactivation is a licensing decision (OCTBASE_MAX_USERS).
#   * The Postgres *role* password (POSTGRES_PASSWORD). That is instance
#     infrastructure, lives in .env, and rotating it means recreating the stack.
- name: Reset an Octbase user's password
  hosts: octbase_hosts
  become: true
  vars:
    linux_user: "{{ client_user_prefix }}{{ client }}"
    app_dir: "/home/{{ linux_user }}/{{ client_app_subdir }}"
    # Mirrors internal/shared/password.go. Kept here rather than read from the
    # app tree because this plays against a running instance, not a checkout.
    app_min_password_length: 12
    app_common_passwords:
      - password1234
      - passwort1234
      - "123456789012"
      - qwertyuiop12
      - adminadmin12
      - letmein12345
      - welcome12345
      - octbase12345
      - changeme1234
      - iloveyou1234

  pre_tasks:
    - name: Load client ledger entry
      ansible.builtin.include_vars:
        file: "../ledger/clients/{{ client }}.yml"
        name: client_ledger
      register: client_ledger_loaded

    - name: Normalize client ledger variable
      ansible.builtin.set_fact:
        client_ledger: "{{ client_ledger_loaded.ansible_facts.client_ledger }}"

    # Same guards as set-max-users: the client name is interpolated into paths,
    # and a suspended client's stack is down, so the psql below would fail
    # halfway with a container error instead of a clear message.
    - name: Validate
      ansible.builtin.assert:
        that:
          - client is defined
          - email is defined
          - email | length > 0
          - client_ledger.name == client
          - client_ledger.name is match('^[a-z][a-z0-9-]{1,27}$')
          - client_ledger.status == 'active'
        fail_msg: >-
          Needs -e client=<name> and -e email=<user email>. The ledger entry
          must be a well-formed name with status 'active' (a suspended client's
          stack is stopped, so there is no database to write to) —
          run ./ledger/ledger.py validate.

    - name: Scope the play to the client's host
      ansible.builtin.meta: end_host
      when: inventory_hostname != (client_ledger.host | default(default_client_host))

  tasks:
    # ── The password ────────────────────────────────────────────────────────
    # 24 chars from [A-Za-z0-9], same as create-instance's initial admin: clears
    # the 12-char minimum and the blocklist by construction.
    - name: Generate a password
      ansible.builtin.set_fact:
        effective_password: >-
          {{ user_password if (user_password is defined)
             else lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}
      no_log: true

    # An operator-supplied password bypasses the app's own validation, because
    # a hash written straight into the table is never checked against the
    # policy. Enforce it here so this playbook cannot be the way a
    # non-conforming password enters the fleet.
    - name: Supplied password must clear the app's policy
      ansible.builtin.assert:
        that:
          - effective_password | length >= app_min_password_length
          - (effective_password | lower) not in app_common_passwords
        fail_msg: >-
          The password given in -e user_password does not meet the app's policy
          (at least {{ app_min_password_length }} characters, and not one of the
          blocklisted common passwords in internal/shared/password.go). Omit
          user_password to have one generated.
      no_log: true
      when: user_password is defined

    - name: Check for the bcrypt module on the admin machine
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: [python3, -c, "import bcrypt"]
      register: bcrypt_probe
      changed_when: false
      failed_when: false

    - name: The admin machine must be able to hash the password
      ansible.builtin.assert:
        that: bcrypt_probe.rc == 0
        fail_msg: >-
          python3 -c 'import bcrypt' failed on the admin machine — install it
          (apt install python3-bcrypt, or pip install bcrypt) and re-run.

    # Cost 12 matches the app's own hashes. python3's bcrypt emits $2b$ where
    # the app emits $2a$; the Go bcrypt the API verifies with checks only the
    # major version, so a $2b$ hash logs in normally (same note as
    # create-instance, which has been producing $2b$ admin hashes since 07-10).
    - name: Hash the password
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import bcrypt, sys
            sys.stdout.write(bcrypt.hashpw(sys.argv[1].encode(), bcrypt.gensalt(12)).decode())
          - "{{ effective_password }}"
      register: pw_hash
      changed_when: false
      no_log: true

    # ── Reach the client's database ─────────────────────────────────────────
    - name: Look up the client account
      ansible.builtin.getent:
        database: passwd
        key: "{{ linux_user }}"

    - name: Set user session env
      ansible.builtin.set_fact:
        user_env:
          XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][linux_user][1] }}"
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd'][linux_user][1] }}/bus"

    - name: Find the Postgres container
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.shell: >
        podman ps -q --filter label=io.podman.compose.service=postgres | head -n1
      register: pg_ctr
      changed_when: false

    - name: The Postgres container must be running
      ansible.builtin.assert:
        that: (pg_ctr.stdout | trim) | length > 0
        fail_msg: >-
          No running Postgres container for {{ client }}. The stack is down —
          start it (systemctl --user -M {{ linux_user }}@ start octbase) and
          re-run.

    # Every psql call below goes through argv with no shell, and passes values
    # as psql variables referenced :'like_this'. psql quotes them as literals,
    # so an address containing a quote cannot break out — and, just as
    # important, a bcrypt hash's $2b$ is never seen by a shell.
    - name: Resolve the user
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ pg_ctr.stdout | trim }}"
          - psql
          - -U
          - octbase
          - -d
          - octbase
          - -t
          - -A
          - -F
          - "|"
          - -v
          - "ON_ERROR_STOP=1"
          - -v
          - "email={{ email }}"
          - -c
          - >-
            SELECT id, status, is_active, mfa_enabled,
                   coalesce(password_hash, '')
              FROM users WHERE lower(email) = lower(:'email');
      register: user_row
      changed_when: false

    # Exactly one row, or stop. A typo'd address must fail here rather than
    # match nobody and report success, and two rows would make "which account
    # did I just reset" unanswerable.
    - name: Exactly one account must match
      ansible.builtin.assert:
        that: (user_row.stdout_lines | select('search', '\|') | list | length) == 1
        fail_msg: >-
          Expected exactly one user with email '{{ email }}' on {{ client }},
          found {{ user_row.stdout_lines | select('search', '\|') | list | length }}.
          Check the address (matching is case-insensitive).

    - name: Read the account's fields
      ansible.builtin.set_fact:
        target_user_id: "{{ (user_row.stdout | trim).split('|')[0] }}"
        target_status: "{{ (user_row.stdout | trim).split('|')[1] }}"
        target_is_active: "{{ (user_row.stdout | trim).split('|')[2] }}"
        target_mfa: "{{ (user_row.stdout | trim).split('|')[3] }}"
        target_old_hash: "{{ (user_row.stdout | trim).split('|')[4] }}"

    # ── The reset ───────────────────────────────────────────────────────────
    # One transaction, the same end state as the app's own reset
    # (auth/password_reset.go): set the hash, end every session, spend any
    # pending reset token, and leave an audit row so an out-of-band reset is
    # visible in /audit-logs like a self-service one is.
    - name: Reset the password
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ pg_ctr.stdout | trim }}"
          - psql
          - -U
          - octbase
          - -d
          - octbase
          - -t
          - -A
          - -F
          - "|"
          - -v
          - "ON_ERROR_STOP=1"
          - -v
          - "uid={{ target_user_id }}"
          - -v
          - "hash={{ pw_hash.stdout | trim }}"
          - -v
          - "operator={{ lookup('env', 'USER') | default('unknown', true) }}"
          - -c
          - >-
            BEGIN;
            UPDATE users SET password_hash = :'hash', updated_at = now()
              WHERE id = :'uid';
            DELETE FROM refresh_tokens WHERE user_id = :'uid';
            UPDATE password_reset_tokens SET used_at = now()
              WHERE user_id = :'uid' AND used_at IS NULL;
            INSERT INTO audit_logs
                   (id, actor_user_id, action, target_type, target_id,
                    metadata_json, ip_address, user_agent)
            VALUES (gen_random_uuid()::text, '', 'USER_PASSWORD_RESET',
                    'user', :'uid',
                    json_build_object('method', 'ops_playbook',
                                      'operator', :'operator')::text,
                    '', 'octbase-service/reset-user-password.yml');
            COMMIT;
      register: reset_sql
      no_log: true

    # Don't trust the transaction's exit code alone — read the row back, the
    # way every other check in this repo does.
    - name: Read back the stored hash and remaining sessions
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ pg_ctr.stdout | trim }}"
          - psql
          - -U
          - octbase
          - -d
          - octbase
          - -t
          - -A
          - -F
          - "|"
          - -v
          - "ON_ERROR_STOP=1"
          - -v
          - "uid={{ target_user_id }}"
          - -c
          - >-
            SELECT u.password_hash,
                   (SELECT count(*) FROM refresh_tokens r WHERE r.user_id = u.id)
              FROM users u WHERE u.id = :'uid';
      register: verify_row
      changed_when: false
      no_log: true

    - name: The new hash must be stored and every session gone
      ansible.builtin.assert:
        that:
          - (verify_row.stdout | trim).split('|')[0] == (pw_hash.stdout | trim)
          - (verify_row.stdout | trim).split('|')[1] | int == 0
        fail_msg: >-
          The password was not stored as expected on {{ client }} for
          {{ email }}. The account has been left as it was found; investigate
          before telling anyone the password changed.
      no_log: true

    # ── Report ──────────────────────────────────────────────────────────────
    # No restart: the API reads users on every login, so the new password is
    # live the moment the transaction commits.
    - name: Result
      ansible.builtin.debug:
        msg: >-
          {{ client }} ({{ client_ledger.host | default(default_client_host) }}):
          password reset for {{ email }} (user {{ target_user_id }}).
          New password: {{ effective_password }}
          — printed once, not stored anywhere; give it to the user over a
          channel they already trust and have them change it after login.
          All existing sessions were ended and any pending reset link is spent.
          {{ 'NOTE: this account has MFA enabled — the new password alone will '
             'not get them in if they have lost their authenticator.'
             if (target_mfa | trim | lower == 't') else '' }}
          {{ 'WARNING: the account is status=' ~ target_status ~ ', is_active='
             ~ target_is_active ~ ' — the new password is valid but login will '
             'still be refused until the account is active again.'
             if (target_status | trim != 'active') else '' }}
          {{ 'NOTE: this account had no password hash before (invited but never '
             'accepted, or SSO) — it can now log in with a password.'
             if (target_old_hash | trim | length == 0) else '' }}

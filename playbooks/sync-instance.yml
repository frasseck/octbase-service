---
# Sync an EXISTING Octbase client installation to a branch of the app repo
# (main) and redeploy it.
#
#   ansible-playbook playbooks/sync-instance.yml -e client=demo
#
# Unlike create-instance.yml this is UPDATE-ONLY: it does not create the Linux
# account, generate secrets, or write/rewrite the client's .env — it refuses if
# the instance has not been provisioned yet. What it does: fetch the requested
# branch of frasseck/octbase-app.git on the ADMIN machine (the host never talks to
# GitHub — same model as create-instance's octbase_src rsync), push that tree
# into ~/octbase, refresh the production compose override, then ALWAYS rebuild
# the images, restart the stack and gate on /health — app code is baked into
# the images at build time, so every run causes a brief restart, even when the
# tree is already at the branch tip.
#
# Data (pgdata, attachments), the .env secrets, ports and ledger-managed
# settings are left untouched — the sole exception is OCTBASE_APP_VERSION, which
# is re-applied from the ledger so a sync cannot leave the stamp behind the code
# (C4); edit app_version in the ledger first. To re-apply the OTHER ledger and
# platform .env settings, run create-instance.yml (idempotent).
# Deploy-source contract: C13 covers the
# working-tree rsync path; this playbook is the git-branch path (see the
# consistency register). Make sure the branch is at or above the running
# schema version before syncing a live instance.
- name: Sync Octbase client instance to an app-repo branch
  hosts: octbase_hosts
  become: true
  vars:
    linux_user: "{{ client_user_prefix }}{{ client }}"
    home_dir: "/home/{{ linux_user }}"
    app_dir: "{{ home_dir }}/{{ client_app_subdir }}"
    fqdn: "{{ client }}.{{ base_domain }}"

  pre_tasks:
    - name: Load client ledger entry
      ansible.builtin.include_vars:
        file: "../ledger/clients/{{ client }}.yml"
        name: client_ledger
      register: client_ledger_loaded

    - name: Normalize client ledger variable
      ansible.builtin.set_fact:
        client_ledger: "{{ client_ledger_loaded.ansible_facts.client_ledger }}"

    - name: Validate ledger entry
      ansible.builtin.assert:
        that:
          - client is defined
          - client_ledger.name == client
          - client_ledger.status == 'active'
          - client_ledger.ports.api is defined
        fail_msg: >-
          Ledger entry for '{{ client | default('?') }}' is missing or not
          'active' — run ./ledger/ledger.py validate.

    - name: Check and announce the client's host
      ansible.builtin.include_tasks: tasks/assert-client-host.yml
      vars:
        client_host: "{{ client_ledger.host | default(default_client_host) }}"

    - name: Scope the play to the client's host
      ansible.builtin.meta: end_host
      when: inventory_hostname != (client_ledger.host | default(default_client_host))

    - name: Look up the client account (must already exist)
      ansible.builtin.getent:
        database: passwd
        key: "{{ linux_user }}"
      register: account
      failed_when: false

    - name: Refuse to sync an unprovisioned instance
      ansible.builtin.assert:
        that: account.ansible_facts is defined
        fail_msg: >-
          No account {{ linux_user }} on this host — sync-instance only updates
          an existing installation. Provision it first with create-instance.yml.

    - name: Set client runtime facts
      ansible.builtin.set_fact:
        client_uid: "{{ account.ansible_facts.getent_passwd[linux_user][1] }}"
        user_env:
          XDG_RUNTIME_DIR: "/run/user/{{ account.ansible_facts.getent_passwd[linux_user][1] }}"
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ account.ansible_facts.getent_passwd[linux_user][1] }}/bus"

    - name: Confirm this is a compose-based Octbase checkout
      ansible.builtin.stat:
        path: "{{ app_dir }}/podman-compose.yml"
      register: compose_file

    - name: The installation must already be a checkout
      ansible.builtin.assert:
        that: compose_file.stat.exists
        fail_msg: >-
          {{ app_dir }} has no podman-compose.yml — nothing to sync. Provision
          the instance with create-instance.yml first.

  tasks:
    # On the ADMIN machine, not the host: the admin account owns the GitHub
    # deploy key (root SSH to GitHub is neither wanted nor set up), exactly as
    # octbase_src is a working tree on the admin machine. become: false runs it
    # as the connecting admin user rather than sudo.
    - name: Fetch the requested branch on the admin machine
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.git:
        repo: "{{ octbase_repo }}"
        dest: "{{ octbase_git_cache }}"
        version: "{{ octbase_branch }}"
        depth: 1
        single_branch: true
        force: true
        # single_branch pins the clone's fetch refspec to the FIRST branch it
        # ever fetched, so a later -e octbase_branch=<other> could not be
        # checked out until the cache dir was hand-deleted. Fetching the
        # requested branch by explicit refspec makes the cache follow whatever
        # branch this run asks for, shallow clone or not.
        refspec: "+refs/heads/{{ octbase_branch }}:refs/remotes/origin/{{ octbase_branch }}"
      register: appclone

    # ── Pre-flight: the DB must not be ahead of the migrations being deployed ─
    # On 2026-08-04 a sync of demo took its API down and beyags with it. App
    # commit 56827b4 squashed migrations 001-039 into 001_baseline, so a database
    # recorded at version 38/39 has no file for its version, golang-migrate
    # cannot build a plan, and the API exits — it crash-loops without ever
    # binding a port. The failure surfaced 150 seconds later as this play's
    # "Wait for API health" timing out, which names nothing useful, and
    # golang-migrate's own message ("no migration found for version 38: read
    # down for version 38") reads like a corrupt file rather than a database
    # from before a history rewrite.
    #
    # A known-fatal, precisely detectable precondition belongs in a pre-flight,
    # not a post-hoc timeout. This runs BEFORE the rsync, so a refusal leaves
    # the instance exactly as it was — still serving on its old code.
    - name: Read the migration versions the branch ships
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.find:
        paths: "{{ octbase_git_cache }}/octbase-api/migrations"
        patterns: "*.up.sql"
      register: branch_migrations

    - name: Read the schema version the client's database records
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - octbase_postgres_1
          - psql
          - -U
          - octbase
          - -d
          - octbase
          - -tAc
          - SELECT version FROM schema_migrations
      register: db_schema_version
      changed_when: false
      failed_when: false

    # Deliberately advisory when the query fails: a stopped stack, a database
    # still starting, or a first-ever sync are all states where nothing can be
    # proven, and refusing there would block the very deploy that fixes them.
    # The assert below only fires on a version we positively read.
    - name: Note when the schema version could not be read
      ansible.builtin.debug:
        msg: >-
          Could not read schema_migrations from {{ linux_user }}'s database
          ({{ db_schema_version.stderr | default('') | trim | default('no output', true) }}).
          Skipping the migration pre-flight — if the API fails to start after
          this run, check whether its recorded version still has a migration
          file (docs/operations.md, baseline stamping).
      when: db_schema_version.rc != 0 or (db_schema_version.stdout | default('') | trim) == ''

    - name: The database's recorded migration must exist in the branch
      vars:
        recorded: "{{ db_schema_version.stdout | trim }}"
        shipped: "{{ branch_migrations.files | map(attribute='path') | map('basename') | list }}"
      ansible.builtin.assert:
        that:
          - shipped | select('match', '^0*' ~ recorded ~ '_') | list | length > 0
        fail_msg: >-
          REFUSING TO SYNC: {{ client }}'s database records migration version
          {{ recorded }}, and branch '{{ octbase_branch }}' ships no migration
          file for it ({{ shipped | sort | join(', ') }}). The API would not
          start — golang-migrate cannot plan from a version it has no file for,
          and the stack would crash-loop without binding a port, taking the
          instance down. This is the 001_baseline squash: stamp the database to
          the baseline first (procedure in the app repo's docs/operations.md and
          octbase-operations/stamp-baseline.sh), then re-run this play. Nothing
          has been changed on the instance.
        success_msg: >-
          Migration pre-flight OK — database at version {{ recorded }}, and
          branch '{{ octbase_branch }}' ships a file for it.
      when: db_schema_version.rc == 0 and (db_schema_version.stdout | default('') | trim) != ''

    - name: Sync application source into the client account
      ansible.posix.synchronize:
        src: "{{ octbase_git_cache }}/"
        dest: "{{ app_dir }}/"
        archive: true
        # Authoritative, not additive — see set-version.yml for what an additive
        # sync cost us. Moving BACKWARDS along a branch has the same failure: the
        # files the newer tip added stay behind and get compiled into the image.
        # Excluded paths are protected from deletion by rsync itself.
        delete: true
        # See create-instance.yml: with become the synchronize plugin auto-adds
        # its own --rsync-path=sudo rsync; setting it here prevents a duplicate.
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=pgdata*"
          - "--exclude=attachments"
          - "--exclude=.pytest_cache"
          - "--exclude=node_modules"
          # Internal development prompts — not part of the product.
          - "--exclude=/prompts"
          # Not in the app repo — the next task lays it down. Excluding it keeps
          # --delete from removing it and leaving a window with no override.
          - "--exclude=/podman-compose.client.yml"
          - "--chown={{ linux_user }}:{{ linux_user }}"
      register: appsrc

    # Kept in step with create-instance: a base podman-compose.yml change on the
    # branch may need a matching override, and the override is not in the app
    # repo (rsync never overwrites it). copy is a no-op when already current.
    - name: Refresh the production compose override
      ansible.builtin.copy:
        src: podman-compose.client.yml
        dest: "{{ app_dir }}/podman-compose.client.yml"
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0644"
      register: override

    # The one .env line this playbook owns: without it a sync could move the
    # code ahead of the stamp and the instance would report a stale version
    # until create-instance.yml re-ran (C4). The value still comes from the
    # ledger, exactly as in create-instance.yml — set app_version there first,
    # this only propagates it. The restart below picks it up.
    - name: Sync the version stamp into .env
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^OCTBASE_APP_VERSION="
        line: "OCTBASE_APP_VERSION={{ client_ledger.app_version | default(octbase_version) }}"

    # App code is baked into the images at build time (not bind-mounted).
    # Always rebuild/restart on sync so the instance is guaranteed to run the
    # freshly fetched main tip even if rsync metadata says "unchanged".
    # Deliberately NO notify/handler wiring for this: the explicit restart
    # below is the only one, and it runs BEFORE the health gate. A handler
    # would fire at the end of the play — after the gate — restarting the
    # stack a second time with nothing verifying it came back.
    - name: Rebuild container images from the synced source
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.command:
        cmd: podman-compose -f podman-compose.yml -f podman-compose.client.yml build
        chdir: "{{ app_dir }}"
      changed_when: false
      timeout: 3600

    - name: Restart the stack on rebuilt images
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.systemd_service:
        name: octbase
        scope: user
        daemon_reload: true
        state: restarted

    - name: Wait for API health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ client_ledger.ports.api }}/health"
        status_code: 200
      register: health
      retries: 30
      delay: 5
      until: health.status == 200

    - name: Prune unused Podman images
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.command:
        cmd: podman image prune -f

    - name: Sync summary
      ansible.builtin.debug:
        msg: >-
          {{ fqdn }} synced to {{ octbase_repo }}@{{ octbase_branch }}
          ({{ appclone.after | default('?') | truncate(12, true, '') }}).
          Rebuilt and restarted; API /health 200 on 127.0.0.1:{{ client_ledger.ports.api }}.

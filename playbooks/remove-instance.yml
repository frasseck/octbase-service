---
# Offboard a client instance — DESTRUCTIVE. Requires an explicit confirmation:
#
#   ansible-playbook playbooks/remove-instance.yml -e client=acme
#     -> prompts: type the client name to confirm
#
# Pass -e confirm=acme to skip the prompt (scripted runs). Ansible also skips
# it in a non-interactive session, where the assert below then fails closed.
#
# Takes a final backup (pg_dump + attachments + .env) to {{ backup_dir }},
# then deletes the Linux account with all its data and deregisters the client
# from monitoring and the edge. A stopped stack (e.g. a suspended client being
# offboarded) is started just long enough for the dump — offboarding never
# requires forgoing the backup. Pass -e skip_backup=true ONLY when the stack
# is broken beyond ANY dump: it deletes the sole copy of the client's
# database and files, and ALL DATA IS THEN UNRECOVERABLE.
#
# Afterwards, manually: remove the DNS record, reload the edge proxy, and set
# status: removed in the ledger file (keep the file as the historical record).
- name: Remove Octbase client instance
  hosts: octbase_hosts
  become: true

  # Skipped when -e confirm=<name> is given, and in any non-interactive
  # session; the assert in pre_tasks stays the actual enforcement.
  vars_prompt:
    - name: confirm
      prompt: |-
        DESTRUCTIVE: deletes the Linux account, the stack and ALL data for this client.
        Type the client name to confirm
      private: false

  vars:
    linux_user: "{{ client_user_prefix }}{{ client }}"
    home_dir: "/home/{{ linux_user }}"
    app_dir: "{{ home_dir }}/{{ client_app_subdir }}"
    fqdn: "{{ client }}.{{ base_domain }}"
    ts: "{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

  pre_tasks:
    - name: Load client ledger entry
      ansible.builtin.include_vars:
        file: "../ledger/clients/{{ client }}.yml"
        name: client_ledger
      register: client_ledger_loaded

    - name: Normalize client ledger variable
      ansible.builtin.set_fact:
        client_ledger: "{{ client_ledger_loaded.ansible_facts.client_ledger }}"

    - name: Require explicit confirmation
      ansible.builtin.assert:
        that:
          - client is defined
          - client_ledger.name == client
          # Same name pattern create-instance enforces — the name is
          # interpolated into root shell commands and paths below.
          - client_ledger.name is match('^[a-z][a-z0-9-]{1,27}$')
          - confirm is defined
          - confirm == client
        fail_msg: >-
          Refusing: confirm with exactly the client name
          ({{ client | default('<name>') }}) at the prompt, or pass
          -e confirm={{ client | default('<name>') }} to really remove it.

    - name: Check and announce the client's host
      ansible.builtin.include_tasks: tasks/assert-client-host.yml
      vars:
        client_host: "{{ client_ledger.host | default(default_client_host) }}"

    - name: Scope the play to the client's host
      ansible.builtin.meta: end_host
      when: inventory_hostname != (client_ledger.host | default(default_client_host))

  tasks:
    # First, so a monitor run during the teardown window doesn't fire a
    # spurious DOWN alert for a client we are deliberately removing. (If the
    # play aborts later, e.g. on a failed backup, re-run create-instance.yml
    # or this play to restore/finish — until then the client is unmonitored.)
    - name: Deregister from monitoring
      ansible.builtin.file:
        path: "{{ clients_registry_dir }}/{{ client }}.conf"
        state: absent

    - name: Check whether the account exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ linux_user }}"
      register: account
      failed_when: false

    - name: Account-scoped teardown
      when: account.ansible_facts is defined
      vars:
        client_uid: "{{ account.ansible_facts.getent_passwd[linux_user][1] }}"
        user_env:
          XDG_RUNTIME_DIR: "/run/user/{{ account.ansible_facts.getent_passwd[linux_user][1] }}"
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ account.ansible_facts.getent_passwd[linux_user][1] }}/bus"
      block:
        - name: Ensure backup directory exists
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: directory
            mode: "0700"
          when: not (skip_backup | default(false) | bool)

        # A suspended client's unit is down and its ExecStop is `podman-compose
        # down` — no containers exist at all, so the final pg_dump would fail
        # and push the operator toward -e skip_backup=true, i.e. deleting the
        # only copy of the data. Detect that and start the stack just for the
        # dump; the unconditional stop in the teardown below winds it down
        # again either way.
        - name: Check whether the client's postgres container is running
          become_user: "{{ linux_user }}"
          environment: "{{ user_env }}"
          ansible.builtin.shell: |
            set -euo pipefail
            podman ps -q \
              --filter label=io.podman.compose.project=octbase \
              --filter label=io.podman.compose.service=postgres | head -n 1
          args:
            executable: /bin/bash
          register: pg_running
          changed_when: false
          when: not (skip_backup | default(false) | bool)

        - name: Start the stopped stack for the final backup
          become_user: "{{ linux_user }}"
          environment: "{{ user_env }}"
          ansible.builtin.systemd_service:
            name: octbase
            scope: user
            daemon_reload: true
            state: started
          when:
            - not (skip_backup | default(false) | bool)
            - pg_running.stdout | trim | length == 0

        # Label-based, like migrate-instance.yml: the octbase_postgres_1 name
        # is a podman-compose naming convention that has already changed once
        # (<project>-postgres-1 on newer versions). Client accounts always use
        # compose project "octbase" (contract C7). Re-resolved here because a
        # start above creates fresh containers.
        - name: Resolve the postgres container for the backup
          become_user: "{{ linux_user }}"
          environment: "{{ user_env }}"
          ansible.builtin.shell: |
            set -euo pipefail
            podman ps -q \
              --filter label=io.podman.compose.project=octbase \
              --filter label=io.podman.compose.service=postgres | head -n 1
          args:
            executable: /bin/bash
          register: pg_cid
          changed_when: false
          when: not (skip_backup | default(false) | bool)

        - name: A postgres container must be up for the final backup
          ansible.builtin.assert:
            that: pg_cid.stdout | trim | length > 0
            fail_msg: >-
              No running postgres container for {{ linux_user }} even after
              starting the stack — investigate before offboarding. Only if the
              stack is broken beyond ANY dump, re-run with -e skip_backup=true
              — which deletes the sole copy of this client's data and makes
              ALL DATA UNRECOVERABLE.
          when: not (skip_backup | default(false) | bool)

        - name: Wait for postgres readiness
          become_user: "{{ linux_user }}"
          environment: "{{ user_env }}"
          ansible.builtin.command:
            cmd: >-
              podman exec {{ pg_cid.stdout | trim }}
              pg_isready -U octbase -d octbase
          register: pg_ready
          retries: 30
          delay: 2
          until: pg_ready.rc == 0
          changed_when: false
          when: not (skip_backup | default(false) | bool)

        # pipefail is essential: without it the pipeline's exit code is gzip's,
        # and a dead postgres container would yield an empty "successful"
        # backup right before the account (and the only data copy) is deleted.
        - name: Final database backup
          ansible.builtin.shell: |
            set -euo pipefail
            sudo -u {{ linux_user }} XDG_RUNTIME_DIR=/run/user/{{ client_uid }} \
              podman exec {{ pg_cid.stdout | trim }} pg_dump -U octbase octbase \
              | gzip > {{ backup_dir }}/{{ client }}-db-{{ ts }}.sql.gz
          args:
            executable: /bin/bash
            # inherited cwd is the connecting admin account's home (root SSH
            # is refused); sudo -u {{ linux_user }} won't run if that dir
            # isn't reachable by the target user.
            chdir: /tmp
          when: not (skip_backup | default(false) | bool)

        - name: Verify database backup is a complete dump
          ansible.builtin.shell: |
            set -euo pipefail
            gunzip -t {{ backup_dir }}/{{ client }}-db-{{ ts }}.sql.gz
            gunzip -c {{ backup_dir }}/{{ client }}-db-{{ ts }}.sql.gz \
              | tail -n 20 | grep -q 'PostgreSQL database dump complete'
          args:
            executable: /bin/bash
          changed_when: false
          when: not (skip_backup | default(false) | bool)

        - name: Final files backup (attachments + .env)
          ansible.builtin.shell: |
            set -euo pipefail
            tar czf {{ backup_dir }}/{{ client }}-files-{{ ts }}.tar.gz \
              -C {{ home_dir }} {{ client_app_subdir }}/attachments {{ client_app_subdir }}/.env
          args:
            executable: /bin/bash
          when: not (skip_backup | default(false) | bool)

        # Also returns a stack that was started above just for the backup to
        # its stopped state (moot for the account itself — it is deleted two
        # tasks later — but it keeps the teardown order deterministic).
        - name: Stop and disable the stack
          become_user: "{{ linux_user }}"
          environment: "{{ user_env }}"
          ansible.builtin.systemd_service:
            name: octbase
            scope: user
            enabled: false
            state: stopped
          failed_when: false

        - name: Disable linger
          ansible.builtin.command: loginctl disable-linger {{ linux_user }}
          failed_when: false

        - name: Terminate remaining user processes
          ansible.builtin.command: loginctl terminate-user {{ linux_user }}
          failed_when: false

        - name: Delete the account and all its data
          ansible.builtin.user:
            name: "{{ linux_user }}"
            state: absent
            remove: true
            force: true
          register: userdel
          retries: 3
          delay: 5
          until: userdel is succeeded

        - name: Remove the account's resource-cap slice drop-in
          ansible.builtin.file:
            path: "/etc/systemd/system/user-{{ client_uid }}.slice.d"
            state: absent

    - name: Remove edge vhost snippet
      ansible.builtin.file:
        path: "{{ edge_snippet_dir }}/{{ client }}.caddy"
        state: absent

    - name: Manual follow-up steps
      ansible.builtin.debug:
        msg:
          - "Client {{ client }} removed{{ ' WITHOUT a final backup (skip_backup) — ALL DATA IS UNRECOVERABLE' if (skip_backup | default(false) | bool) else '; final backup in ' + backup_dir }}."
          - "1) DNS (manual): delete the {{ fqdn }} record."
          - "2) Edge proxy: reload it (its {{ client }}.caddy snippet is gone)."
          - "3) Ledger: set status: removed in ledger/clients/{{ client }}.yml and commit."

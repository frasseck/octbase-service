---
# Deploy and load the Octbase AppArmor policy on one host.
#
# Included by BOTH entry points, so there is one implementation and no way for
# the two to drift:
#
#   setup-host.yml      — a new host gets the policy with the rest of its baseline
#   install-apparmor.yml — an existing host gets ONLY this, without re-running
#                          the baseline's SSH/firewall/account work
#
# The caller must load the profile catalogue:
#
#     vars_files:
#       - vars/apparmor-profiles.yml
#
# and run with `become: true` (everything here is root work, except the runtime
# probe, which deliberately is not).
#
# Facts this leaves behind for the caller's own summary:
#   apparmor_ok              — the kernel has AppArmor on
#   podman_apparmor_capable  — a ROOTLESS podman here would accept a profile
#                              (practically always false; see the profile headers)
#
# Idempotent, and safe to run repeatedly on a live host: a profile is only
# re-loaded when its file changed or the kernel does not hold it, and the edge
# proxy is only restarted when its drop-in changed.

- name: Check whether AppArmor is available on this host
  ansible.builtin.slurp:
    src: /sys/module/apparmor/parameters/enabled
  register: apparmor_enabled
  failed_when: false

- name: Record the host's AppArmor state
  ansible.builtin.set_fact:
    apparmor_ok: "{{ (apparmor_enabled.content | default('') | b64decode | trim) == 'Y' }}"

- name: AppArmor is not enabled on this kernel
  ansible.builtin.debug:
    msg: >-
      /sys/module/apparmor/parameters/enabled does not read 'Y', so this host
      cannot load the Octbase profiles. On Ubuntu that means AppArmor was
      disabled on the kernel command line (apparmor=0 or
      security=something-else) — undo that and re-run. Skipping the whole
      AppArmor section; nothing else is affected.
  when: not (apparmor_ok | bool)

- name: Set up AppArmor policy
  when: apparmor_ok | bool
  block:
    # Directly in /etc/apparmor.d/, not a subdirectory: apparmor_parser does not
    # recurse, so the boot-time load (apparmor.service) only picks up regular
    # files at the top level. A profile in /etc/apparmor.d/octbase/ would be
    # loaded by this run and then quietly gone after a reboot.
    #
    # `validate` runs the parser in check-only mode BEFORE the file is put in
    # place, so a broken profile can never reach a path the next boot will try
    # to load.
    #
    # src is anchored to playbook_dir rather than left relative: this task file
    # lives in tasks/, and the template search would otherwise depend on which
    # directory Ansible resolves first.
    - name: Install the Octbase AppArmor profiles
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/apparmor/{{ item.name }}.j2"
        dest: "/etc/apparmor.d/{{ item.name }}"
        mode: "0644"
        validate: "apparmor_parser --skip-kernel-load --skip-cache %s"
      loop: "{{ octbase_apparmor_profiles }}"
      loop_control:
        label: "{{ item.name }} ({{ item.mode }})"
      register: apparmor_profile_files

    # What the kernel currently holds, so a profile that was never loaded (first
    # run) or was unloaded by hand is loaded again even when the file on disk is
    # unchanged.
    - name: Read the profiles currently loaded into the kernel
      ansible.builtin.slurp:
        src: /sys/kernel/security/apparmor/profiles
      register: apparmor_loaded

    # Kept as raw text ("<name> (enforce)" per line) and matched on "<name> ("
    # rather than split into a list: a bare substring test would find
    # 'octbase-web' inside 'octbase-web-mailer', and a templated list variable is
    # a string in a non-native-Jinja Ansible, where `not in` would silently
    # become that same substring test.
    - name: Record which profiles the kernel already holds
      ansible.builtin.set_fact:
        apparmor_loaded_text: "{{ apparmor_loaded.content | default('') | b64decode }}"

    - name: Load the Octbase AppArmor profiles
      ansible.builtin.command: >-
        apparmor_parser --replace --write-cache
        /etc/apparmor.d/{{ item.item.name }}
      loop: "{{ apparmor_profile_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - item is changed or (item.item.name ~ ' (') not in apparmor_loaded_text
      changed_when: true

    # The profiles live in /etc/apparmor.d/, which this unit loads at boot.
    # Without it they apply until the next reboot and then silently do not.
    - name: Load AppArmor policy at boot
      ansible.builtin.systemd_service:
        name: apparmor
        enabled: true
        state: started

    # ── The edge proxy ───────────────────────────────────────────────────
    # OFF BY DEFAULT since 2026-08-07, when turning it on took dev01's edge
    # down: caddy.service is Type=notify, and under the drop-in it never
    # signalled readiness, so systemd SIGKILLed it at the start timeout and
    # every domain that host served stopped answering. The profile was in
    # COMPLAIN mode, which should permit everything and log — so the cause is
    # not understood yet, and shipping a security control that is enabled by
    # default and empirically breaks the fleet's front door is not a trade
    # worth making. Register §2.19a has the incident.
    #
    # Everything else in this file stays on: the two script profiles enforce,
    # all nine profiles are loaded. Only the edge attachment waits.
    #
    # Turn it on deliberately, one host at a time, and watch it:
    #   ansible-playbook playbooks/install-apparmor.yml -e target_host=dev01 \
    #       -e apparmor_confine_edge=true
    # If caddy will not start under it, the rescue below puts the edge back
    # before the play exits — that is what was missing the first time.
    #
    # It is confined through its unit rather than by executable path — see the
    # header of templates/apparmor/octbase-edge-caddy.j2: a path attachment on
    # /usr/bin/caddy would also catch the caddy inside the frontend, mobile and
    # marketing containers.
    - name: Create the edge proxy's unit drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/caddy.service.d
        state: directory
        mode: "0755"
      when: apparmor_confine_edge | bool

    - name: Confine the edge proxy with its profile
      when: apparmor_confine_edge | bool
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy.service.d/10-octbase-apparmor.conf
        mode: "0644"
        # A literal marker, not {{ ansible_managed }}: that variable is injected
        # by the TEMPLATE module and does not exist for an inline copy content —
        # under ansible-core 2.19 the task fails outright with "'ansible_managed'
        # is undefined". Every other inline content: in this repo spells the
        # marker out for that reason; the profiles next door are templates, so
        # they can and do use the variable.
        content: |
          # Managed by octbase-service / playbooks/tasks/apparmor.yml
          [Service]
          # The leading '-' makes a missing or unloadable profile non-fatal.
          # A policy problem must not take the fleet's front door down with it.
          AppArmorProfile=-octbase-edge-caddy
      register: caddy_apparmor_dropin

    # A drop-in only reaches the running daemon on a restart — `systemctl reload
    # caddy` re-reads the Caddyfile without re-executing the process, so the
    # confinement would not apply until the next reboot.
    #
    # THE RESCUE IS THE POINT. The first version of this had the restart bare,
    # on the reasoning that it costs a sub-second blip. That reasoning only
    # covers the restart SUCCEEDING. When it failed on dev01 the play stopped
    # with the edge dead and the drop-in still on disk, so every later boot
    # would have failed the same way — a playbook that hardens a host must not
    # be able to leave it worse than it found it.
    - name: Confine the edge proxy, and undo it if the edge will not come up
      when:
        - apparmor_confine_edge | bool
        # default(false): the task that registers this is itself gated on the
        # flag above, and a skipped task registers a result without `changed`.
        - caddy_apparmor_dropin.changed | default(false)
      block:
        - name: Restart the edge proxy under its profile
          ansible.builtin.systemd_service:
            name: caddy
            daemon_reload: true
            state: restarted

      rescue:
        - name: Take the profile back off the edge proxy
          ansible.builtin.file:
            path: /etc/systemd/system/caddy.service.d/10-octbase-apparmor.conf
            state: absent

        - name: Start the edge proxy again, unconfined
          ansible.builtin.systemd_service:
            name: caddy
            daemon_reload: true
            state: restarted

        # Deliberately still a failure: the edge is serving again, but the
        # thing this run was asked to do did not work, and a green run would
        # hide that.
        - name: The edge proxy would not start under its profile
          ansible.builtin.fail:
            msg: >-
              caddy could not start with AppArmorProfile=-octbase-edge-caddy, so
              the drop-in has been removed and caddy restarted WITHOUT it — the
              edge is serving again, and this host is back to where it was
              before this run. Nothing else was rolled back: the nine profiles
              are still loaded and the monitor/backup ones still enforce.
              Diagnose with, as root on {{ inventory_hostname }}:
              `journalctl -xeu caddy.service -n 60` and
              `journalctl -k | grep 'apparmor=.*octbase-edge-caddy'`.
              Note that the profile ships in complain mode, which permits
              everything and only logs — so a denial is NOT the expected
              explanation, and the answer is worth writing into register §2.19a
              before trying again.

# Reported rather than acted on: this is the honest answer to "are the container
# profiles doing anything", and it is No on every rootless host. Run as the
# CONNECTING account, without become, because that is the only rootless context
# available here — `podman info` as root would answer for a runtime no client
# stack uses. It initialises that account's container storage directories, which
# is the one side effect.
- name: Probe whether this host's container runtime can apply AppArmor
  ansible.builtin.command: podman info --format json
  become: false
  register: podman_capability
  changed_when: false
  failed_when: false
  check_mode: false

# `and` short-circuits, so a podman that could not answer at all (no rootless
# setup for this account, say) never reaches from_json. The keys are walked with
# .get() rather than dotted access: a dotted chain over a missing key raises
# UndefinedError mid-expression, where a trailing `| default(false)` never gets
# to catch it.
- name: Record whether the container runtime could apply a profile
  ansible.builtin.set_fact:
    podman_apparmor_capable: "{{ (podman_capability.rc | default(1)) == 0 and (podman_capability.stdout | default('{}', true) | from_json).get('host', {}).get('security', {}).get('apparmorEnabled', false) | bool }}"

# `| string | lower` rather than `| lower`: ansible-core 2.19 templating keeps
# native types, so the fact above is a real bool there and `lower` on a bool is
# a templating error.
- name: AppArmor policy on this host
  ansible.builtin.debug:
    msg: >-
      {{
        ([(octbase_apparmor_profiles | length) ~ ' profiles loaded into /etc/apparmor.d/.',
          'Enforcing now: monitor-all.sh and backup-fleet.sh, attached by path.',
          ('The edge proxy IS confined (' ~ apparmor_mode_edge ~ ' mode) via its unit drop-in.'
           if apparmor_confine_edge | bool else
           'The edge proxy is NOT confined: apparmor_confine_edge is off after the'),
          ('' if apparmor_confine_edge | bool else
           '  2026-08-07 dev01 outage — register §2.19a. Its profile is loaded, unattached.'),
          'Check what policy is actually rejecting:  journalctl -k | grep apparmor=',
          'Loosen one while tuning:  -e apparmor_mode_platform=complain',
          '',
          'The six CONTAINER profiles are loaded and worn by nothing: this host\'s',
          'podman reports AppArmorEnabled=' ~ (podman_apparmor_capable | string | lower) ~ ' for a rootless',
          'runtime, and client stacks are rootless by design. Turning client_apparmor on',
          'would make create-instance.yml refuse rather than deploy an unconfined stack.']
         if apparmor_ok | bool else
         ['⚠ AppArmor is NOT enabled on this kernel — no Octbase profile was loaded.'])
      }}

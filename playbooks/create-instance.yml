---
# Create — or update — one Octbase client instance from its ledger entry.
#
#   ansible-playbook playbooks/create-instance.yml -e client=acme
#
# Idempotent: on an existing instance it re-syncs the app source, re-applies
# the ledger-managed settings (edition, add-on, seats, version) and restarts
# the stack only if something changed. Secrets and data are never touched
# after the first run.
#
# A client with NO ledger entry is not an error any more: the first play below
# interviews the operator and scaffolds the entry before anything is
# provisioned. See its header for what that dialog does and does not do.

# ── Ledger entry ─────────────────────────────────────────────────────────
# The ledger is the single source of truth and every play below reads it, so
# onboarding used to be two commands with a hand-off in between: `ledger.py
# new …` with eight flags to get right, then this playbook. Getting a flag
# wrong was only visible one command later, as an assert failure.
#
# This play closes that gap. It runs on the ADMIN machine (the ledger lives in
# this repo, not on any server) and:
#   - does nothing at all when ledger/clients/<client>.yml already exists —
#     which is the normal case, and the case the migrate playbooks hit, since
#     migrate-instance.yml and migrate-host.yml import this file
#     (`import_playbook`) for clients that are by definition already in the
#     ledger;
#   - otherwise asks for every field, then hands the answers to
#     `ledger/ledger.py new`.
#
# It deliberately does NOT reimplement the ledger schema. Name shape, reserved
# names, editions, the add-on rule, host validity, the date stamp and above all
# the port allocation all stay in ledger.py, which is the one place that can
# see every other client's ports (contracts C3/C8/C10 — docs/consistency-register.md).
# This play only collects answers and reports what the CLI decided.
#
# Prompts are `pause`, not `vars_prompt`, on purpose: vars_prompt fires before
# any task can look at the filesystem, so it would interrogate the operator on
# every run of an existing client — including inside the migrate playbooks.
# The cost is that this path needs a terminal; a scripted onboarding runs
# `./ledger/ledger.py new …` first and then this playbook, exactly as before.
- name: Ensure the client has a ledger entry
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    ledger_py: "{{ playbook_dir }}/../ledger/ledger.py"
    ledger_entry_file: "{{ playbook_dir }}/../ledger/clients/{{ client | default('') }}.yml"

  tasks:
    # Asserted here rather than in the play below, which used to discover it as
    # an include_vars failure on a path with an empty name in it.
    - name: A client name is required
      ansible.builtin.assert:
        that:
          - client is defined
          - client | length > 0
        fail_msg: >-
          Name the client with -e client=<name>. It is the ledger file name,
          the subdomain label and the Linux account suffix.
        quiet: true

    - name: Look for the client's ledger entry
      ansible.builtin.stat:
        path: "{{ ledger_entry_file }}"
      register: ledger_entry

    - name: Onboard a client that is not in the ledger yet
      when: not ledger_entry.stat.exists
      block:
        # The dialog cannot run without a terminal, and --check must not create
        # a ledger file — it is a repo change, not a host change, so a dry run
        # that wrote one would leave a real artefact behind.
        - name: A new client cannot be onboarded in check mode
          ansible.builtin.assert:
            that: not ansible_check_mode
            fail_msg: >-
              '{{ client }}' has no ledger entry
              ({{ ledger_entry_file }}), and creating one asks questions and
              writes a file — neither of which belongs in a --check run. Create
              the entry first with ./ledger/ledger.py new {{ client }} …, or
              re-run without --check to be asked.
            quiet: true

        - name: Announce the onboarding dialog
          ansible.builtin.debug:
            msg:
              - "'{{ client }}' is not in the ledger — scaffolding its entry."
              - "Answers go to ./ledger/ledger.py new, which allocates the port"
              - "block and validates the rest. Nothing is provisioned until the"
              - "entry exists, and nothing is committed for you."
              - "Ctrl-C then A aborts without writing anything."

        - name: Display name
          ansible.builtin.pause:
            prompt: >-
              Display name (the company, as it should read in the client table)
              [default: {{ client }}]
          register: ask_display

        - name: Contact email
          ansible.builtin.pause:
            prompt: >-
              Contact email. This also becomes the login of the instance's
              first SUPER_ADMIN — the only way into a fresh stack — so it must
              be a real mailbox that can receive a password reset
          register: ask_contact

        # Checked at the prompt rather than left to ledger.py, which would only
        # reject it after every remaining question had been answered and thrown
        # away. Same shape check as the assert further down this playbook and as
        # ledger.py's EMAIL_RE: it catches "", "tbd" and "lars at beyags.com",
        # which is what actually goes wrong. Nothing offline proves deliverability.
        - name: The contact must look like an email address
          ansible.builtin.assert:
            that: ask_contact.user_input | trim is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
            fail_msg: >-
              '{{ ask_contact.user_input | trim }}' is not an email address.
              Re-run and give the mailbox the client's first administrator will
              log in with.
            quiet: true

        - name: Edition
          ansible.builtin.pause:
            prompt: "Edition — team | business | enterprise"
          register: ask_edition

        - name: The edition must be one of the three booked products
          ansible.builtin.assert:
            that: ask_edition.user_input | trim | lower in ['team', 'business', 'enterprise']
            fail_msg: >-
              '{{ ask_edition.user_input | trim }}' is not an edition. Expected
              team, business or enterprise.
            quiet: true

        # Booked by default on every edition — an empty answer omits the flag
        # and lets ledger.py apply that default, rather than this play deciding
        # it a second time.
        - name: Jira-CSV-import add-on
          ansible.builtin.pause:
            prompt: >-
              Book the Jira-CSV-import add-on? yes / no
              [empty: booked — it is part of every subscription]
          register: ask_jira

        - name: Licensed seats
          ansible.builtin.pause:
            prompt: "Licensed seats (OCTBASE_MAX_USERS) [default: 25]"
          register: ask_seats

        # argparse would reject a non-integer with a usage dump, three prompts
        # from now.
        - name: Seats must be a whole number
          ansible.builtin.assert:
            that: ask_seats.user_input | trim is match('^[1-9][0-9]*$')
            fail_msg: >-
              '{{ ask_seats.user_input | trim }}' is not a seat count. Give a
              plain number, e.g. 25 — no units.
            quiet: true
          when: ask_seats.user_input | trim | length > 0

        # Empty omits --host so ledger.py applies default_client_host from
        # group_vars, and prints which host that resolved to.
        - name: Placement
          ansible.builtin.pause:
            prompt: >-
              Inventory host to place this instance on —
              {{ groups['octbase_hosts'] | join(' | ') }}
              [empty: the platform default]
          register: ask_host

        # The old host names are the likely typo here: `prod` was renamed to
        # prod01 when the fleet split, so muscle memory produces a name the
        # inventory no longer has.
        - name: The host must be one the inventory knows
          ansible.builtin.assert:
            that: ask_host.user_input | trim in groups['octbase_hosts']
            fail_msg: >-
              '{{ ask_host.user_input | trim }}' is not in inventory/hosts.yml.
              Known hosts: {{ groups['octbase_hosts'] | join(', ') }}. Leave the
              answer empty to take the platform default.
            quiet: true
          when: ask_host.user_input | trim | length > 0

        - name: Disk quota
          ansible.builtin.pause:
            prompt: "Disk quota for the whole client account, in GB [default: 10]"
          register: ask_disk

        - name: The disk quota must be a whole number of GB
          ansible.builtin.assert:
            that: ask_disk.user_input | trim is match('^[1-9][0-9]*$')
            fail_msg: >-
              '{{ ask_disk.user_input | trim }}' is not a size in GB. Give a
              plain number, e.g. 10 — no unit suffix.
            quiet: true
          when: ask_disk.user_input | trim | length > 0

        # Selects the app repo tag AND stamps OCTBASE_APP_VERSION (C4), so the
        # code and the version a client reports cannot drift apart. Empty falls
        # back to octbase_version from group_vars.
        - name: App version
          ansible.builtin.pause:
            prompt: >-
              App version to pin this client to, e.g. 1.0.1
              [empty: the platform default from group_vars]
          register: ask_version

        # ledger.py accepts any string here, so this one gets through the
        # scaffold and fails much later — after the Linux account has been
        # created — when the release-tag probe looks for a tag built as
        # v{{ app_version }} and finds 'vv1.0.1'.
        - name: The app version must be the bare number, without a leading v
          ansible.builtin.assert:
            that: ask_version.user_input | trim is match('^[0-9]')
            fail_msg: >-
              '{{ ask_version.user_input | trim }}' should be the version
              alone, e.g. 1.0.1 — the playbook adds the 'v' when it resolves
              the app repo tag, so a 'v' here becomes v{{ ask_version.user_input | trim }}.
            quiet: true
          when: ask_version.user_input | trim | length > 0

        - name: Scaffold the ledger entry
          ansible.builtin.command:
            argv: "{{ ledger_new_argv }}"
          vars:
            ledger_new_argv: >-
              {{ [ledger_py, 'new', client,
                  '--contact', ask_contact.user_input | trim,
                  '--edition', ask_edition.user_input | trim | lower]
                 + (['--display', ask_display.user_input | trim]
                    if ask_display.user_input | trim else [])
                 + (['--jira-import']
                    if ask_jira.user_input | trim | lower in ['y', 'yes'] else [])
                 + (['--no-jira-import']
                    if ask_jira.user_input | trim | lower in ['n', 'no'] else [])
                 + (['--max-users', ask_seats.user_input | trim]
                    if ask_seats.user_input | trim else [])
                 + (['--host', ask_host.user_input | trim]
                    if ask_host.user_input | trim else [])
                 + (['--disk-quota-gb', ask_disk.user_input | trim]
                    if ask_disk.user_input | trim else [])
                 + (['--app-version', ask_version.user_input | trim]
                    if ask_version.user_input | trim else []) }}
          register: ledger_new
          changed_when: true

        # The CLI reports the host it resolved and the port block it allocated
        # — the two answers the operator did not give it.
        - name: What the ledger CLI decided
          ansible.builtin.debug:
            msg: "{{ ledger_new.stdout_lines }}"

        # The repo-wide check, not just this file: allocation is only correct
        # relative to every other entry, and this is the same command the
        # README requires before committing any ledger change.
        - name: Validate the whole ledger
          ansible.builtin.command:
            argv: ["{{ ledger_py }}", validate]
          register: ledger_validate
          changed_when: false

        - name: The new entry is not committed yet
          ansible.builtin.debug:
            msg:
              - "{{ ledger_validate.stdout | trim }}"
              - ""
              - "⚠ {{ ledger_entry_file | basename }} is written but UNCOMMITTED."
              - "  The git history of ledger/clients/ is the audit trail of the"
              - "  client base — commit it, ideally before the provisioning below"
              - "  changes anything on the host:"
              - "    git add ledger/clients/{{ client }}.yml && git commit"
              - ""
              - "Provisioning continues now. DNS for the instance is still manual"
              - "— see the follow-up steps printed at the end of this run."

    - name: Ledger entry in use
      ansible.builtin.debug:
        msg: "{{ client }}: using existing ledger entry {{ ledger_entry_file }}"
      when: ledger_entry.stat.exists

- name: Create / update Octbase client instance
  hosts: octbase_hosts
  become: true
  vars:
    linux_user: "{{ client_user_prefix }}{{ client }}"
    home_dir: "/home/{{ linux_user }}"
    app_dir: "{{ home_dir }}/{{ client_app_subdir }}"
    fqdn: "{{ client }}.{{ base_domain }}"
    # Login of the instance's first SUPER_ADMIN, from the ledger. This used to
    # be "admin@{{ client }}.{{ base_domain }}" — an address on the client's own
    # subdomain, which has no mailbox anywhere and no MX record, so the one
    # account that can administer the instance could never receive a password
    # reset. The ledger's contact is a real address by definition, and it is
    # already the person being onboarded. Play vars are evaluated lazily, so
    # referring to client_ledger here is fine: it is set in pre_tasks, long
    # before the .env template and the credential printout use this.
    admin_email: "{{ client_ledger.contact | default('') | trim | lower }}"

  pre_tasks:
    # First, before anything templates a group_vars value: when group_vars/all
    # fails to load, ansible-core 2.19 does not stop at startup — the play dies
    # mid-run on whichever variable happens to be templated first, with an
    # "is undefined" that reads like a playbook bug (D33's neighbour: it
    # happened twice on 2026-08-07). Name the actual causes instead.
    - name: Group vars must be loaded
      ansible.builtin.assert:
        that: client_user_prefix is defined
        fail_msg: >-
          group_vars/all did not load. Seen causes: the vault password is
          missing — pass --ask-vault-pass or set ANSIBLE_VAULT_PASSWORD_FILE
          (required since inventory/group_vars/all/vault.yml exists) — or the
          run was started outside the repo root, so ansible.cfg (and with it
          inventory/hosts.yml + its group_vars) was never picked up, or a
          group_vars file is vault-encrypted that must not be (only vault.yml
          is; see the register, D33).

    - name: Load client ledger entry
      ansible.builtin.include_vars:
        file: "../ledger/clients/{{ client }}.yml"
        name: client_ledger
      register: client_ledger_loaded

    - name: Normalize client ledger variable
      ansible.builtin.set_fact:
        client_ledger: "{{ client_ledger_loaded.ansible_facts.client_ledger }}"

    - name: Validate ledger entry
      ansible.builtin.assert:
        that:
          - client is defined
          - client_ledger.name == client
          - client_ledger.name is match('^[a-z][a-z0-9-]{1,27}$')
          - client_ledger.name not in ['www', 'dev', 'test', 'mail', 'api', 'octbase', 'admin']
          - client_ledger.edition | lower in ['team', 'business', 'enterprise']
          # No edition/add-on combination is refused any more: the Jira import
          # is part of every subscription since 2026-08-07. The app's own TEAM
          # gate is tracked as drift under the register's C3.
          - client_ledger.max_users | int >= 1
          - client_ledger.ports.frontend is defined and client_ledger.ports.api is defined and client_ledger.ports.postgres is defined
          - client_ledger.status == 'active'
        fail_msg: >-
          Ledger entry for '{{ client | default('?') }}' is invalid or not
          'active' — run ./ledger/ledger.py validate.

    # ── Host scoping: the instance lives on exactly one inventory host ──
    - name: Check and announce the client's host
      ansible.builtin.include_tasks: tasks/assert-client-host.yml
      vars:
        client_host: "{{ client_ledger.host | default(default_client_host) }}"

    - name: Scope the play to the client's host
      ansible.builtin.meta: end_host
      when: inventory_hostname != (client_ledger.host | default(default_client_host))

    # Earlier than the other pre-flights on purpose: a provision that cannot
    # sync its source should not have created a Linux account first.
    - name: Check the target host can receive an rsync
      ansible.builtin.include_tasks: tasks/assert-rsync-present.yml

    # Generated on the admin machine; only used the first time the .env is
    # written (the template task below never overwrites an existing file).
    - name: Generate initial secrets
      ansible.builtin.set_fact:
        gen_jwt_secret: "{{ lookup('pipe', 'openssl rand -base64 32') }}"
        gen_scm_key: "{{ lookup('pipe', 'openssl rand -base64 32') }}"
        gen_mfa_key: "{{ lookup('pipe', 'openssl rand -base64 32') }}"
        gen_pg_password: "{{ lookup('pipe', 'openssl rand -hex 16') }}"
      no_log: true

  tasks:
    - name: Create client Linux account
      ansible.builtin.user:
        name: "{{ linux_user }}"
        comment: "Octbase client {{ client_ledger.display_name | default(client) }}"
        shell: /bin/bash
        create_home: true
      register: client_account

    - name: Set client account facts
      ansible.builtin.set_fact:
        client_uid: "{{ client_account.uid }}"
        user_env:
          XDG_RUNTIME_DIR: "/run/user/{{ client_account.uid }}"
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ client_account.uid }}/bus"

    # Linger keeps the user's systemd instance (and thus the stack) running
    # without a login session, and starts it at boot.
    - name: Enable systemd linger
      ansible.builtin.command: loginctl enable-linger {{ linux_user }}
      args:
        creates: /var/lib/systemd/linger/{{ linux_user }}

    - name: Restrict home directory
      ansible.builtin.file:
        path: "{{ home_dir }}"
        mode: "0750"

    # ── AppArmor confinement (opt-in, group_vars: client_apparmor) ──
    # Checked here — right after the account exists and before anything is
    # built — because the answer decides whether this run may proceed at all.
    - name: Check the container runtime can apply the AppArmor profiles
      ansible.builtin.include_tasks: tasks/assert-apparmor-capable.yml

    # ── Account-level resource caps (docs/fleet-concept.md §2) ──
    - name: Set resource / disk-quota facts
      ansible.builtin.set_fact:
        client_resources: "{{ client_default_resources | combine(client_ledger.resources | default({})) }}"
        client_disk_quota_gb: "{{ client_ledger.disk_quota_gb | default(default_disk_quota_gb) }}"

    - name: Ensure the user-slice drop-in directory exists
      ansible.builtin.file:
        path: "/etc/systemd/system/user-{{ client_uid }}.slice.d"
        state: directory
        mode: "0755"

    - name: Apply account resource caps (systemd user-slice drop-in)
      ansible.builtin.template:
        src: user-slice.j2
        dest: "/etc/systemd/system/user-{{ client_uid }}.slice.d/99-octbase.conf"
        mode: "0644"
      register: slice_dropin

    - name: Reload systemd to apply the slice caps
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: slice_dropin.changed

    # ── Disk quota: enforce where the filesystem can, monitor always ──
    - name: Find the filesystem holding the client home
      ansible.builtin.command:
        cmd: df --output=target {{ home_dir }}
      register: home_mount
      changed_when: false

    - name: Apply the filesystem user quota (soft 90% / hard 100%)
      ansible.builtin.command:
        cmd: >-
          setquota -u {{ linux_user }}
          {{ ((client_disk_quota_gb | int) * 1024 * 1024 * 0.9) | int }}
          {{ (client_disk_quota_gb | int) * 1024 * 1024 }}
          0 0 {{ home_mount.stdout_lines | last | trim }}
      register: quota_set
      changed_when: quota_set.rc == 0
      failed_when: false

    - name: Warn when the filesystem cannot enforce the quota
      ansible.builtin.debug:
        msg: >-
          Filesystem user quota NOT enforced for {{ linux_user }}
          (setquota failed: {{ quota_set.stderr | default('') | trim | default('not available', true) }}).
          Usage is still monitored and alerts at {{ disk_alert_pct }}% of
          {{ client_disk_quota_gb }} GB — enable usrquota on
          {{ home_mount.stdout_lines | last | trim }} to enforce
          (docs/fleet-concept.md §3).
      when: quota_set.rc != 0

    # ── Deploy source: the ledger's app_version selects the code ───────────
    # app_version picks the app repo tag AND stamps OCTBASE_APP_VERSION, so a
    # client cannot run code that disagrees with its own version stamp (C4).
    # This replaces an rsync of the octbase_src working tree, whose "released
    # commit, clean tree" contract (C13) was upheld by hand and in practice
    # shipped whatever branch — and whatever uncommitted edit — the admin's
    # live dev checkout happened to be sitting on.
    # The migrate playbooks import this play with octbase_src_remote to reuse
    # the source already on the host; that path is untouched below.
    - name: Resolve the release tag for this client
      ansible.builtin.set_fact:
        client_release_tag: "v{{ client_ledger.app_version | default(octbase_version) }}"

    - name: Check the release tag exists in the app repo
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - --exit-code
          - "{{ octbase_repo }}"
          - "refs/tags/{{ client_release_tag }}"
      register: release_tag_probe
      changed_when: false
      failed_when: false
      when: octbase_src_remote is not defined

    - name: The client's app_version must name a real release tag
      ansible.builtin.assert:
        that: release_tag_probe.rc == 0
        fail_msg: >-
          {{ octbase_repo }} has no tag '{{ client_release_tag }}', which is
          what app_version
          '{{ client_ledger.app_version | default(octbase_version) }}' selects
          for {{ client }}. Tag the release in the app repo (and give it a dated
          CHANGELOG.md entry — C4), or point the ledger's app_version at a
          version that is already tagged.
      when: octbase_src_remote is not defined

    # The refspec must name the tag — see the long comment in set-version.yml:
    # a bare fetch of this shared cache resolves whatever tag it was first
    # cloned at, which breaks every deploy once that tag is gone upstream.
    - name: Fetch the release on the admin machine
      delegate_to: localhost
      become: false
      ansible.builtin.git:
        repo: "{{ octbase_repo }}"
        dest: "{{ octbase_release_cache }}"
        version: "{{ client_release_tag }}"
        refspec: "+refs/tags/{{ client_release_tag }}:refs/tags/{{ client_release_tag }}"
        depth: 1
        force: true
      when: octbase_src_remote is not defined

    - name: Sync application source from the release cache
      ansible.posix.synchronize:
        src: "{{ octbase_release_cache }}/"
        dest: "{{ app_dir }}/"
        archive: true
        # Authoritative, not additive — see set-version.yml. A fresh provision has
        # nothing to delete, but the migrate playbooks import this play to re-lay
        # source over an existing app_dir, where an additive sync would keep files
        # from whatever ref was there before.
        delete: true
        # The synchronize action plugin auto-adds a --rsync-path=sudo rsync
        # itself whenever `become` is set and this parameter is empty (root
        # is otherwise unwritable/unchownable to a non-root ansible_user).
        # Setting it explicitly here (rather than via rsync_opts) prevents
        # the plugin from also injecting its own, which produced a duplicate
        # --rsync-path on the command line and broke sudo's arg parsing.
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=pgdata*"
          - "--exclude=attachments"
          - "--exclude=.pytest_cache"
          - "--exclude=node_modules"
          # Internal development prompts — not part of the product.
          - "--exclude=/prompts"
          # Not in the app repo — a later task lays it down. Excluding it keeps
          # --delete from removing it and leaving a window with no override.
          - "--exclude=/podman-compose.client.yml"
          - "--chown={{ linux_user }}:{{ linux_user }}"
      notify: Restart stack
      when: octbase_src_remote is not defined

    - name: Sync application source from source checkout on target host
      ansible.builtin.command:
        # --delete for the same reason as the release-cache path above: this is
        # the host-to-host path the migrate playbooks use, and it re-lays source
        # over a directory that may already hold a different ref's files.
        cmd: >-
          rsync -a --delete
          --exclude=.git
          --exclude=.env
          --exclude=pgdata*
          --exclude=attachments
          --exclude=.pytest_cache
          --exclude=node_modules
          --exclude=/prompts
          --exclude=/podman-compose.client.yml
          --chown={{ linux_user }}:{{ linux_user }}
          {{ octbase_src_remote }}/
          {{ app_dir }}/
      notify: Restart stack
      when: octbase_src_remote is defined

    # template, not copy: the override carries a security_opt per service when
    # client_apparmor is on (group_vars). With it off — the default — the file
    # is exactly the static one this task used to install.
    - name: Install production compose override
      ansible.builtin.template:
        src: podman-compose.client.yml.j2
        dest: "{{ app_dir }}/podman-compose.client.yml"
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0644"
      notify: Restart stack

    - name: Create attachments directory
      ansible.builtin.file:
        path: "{{ app_dir }}/attachments"
        state: directory
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0700"

    # ── Initial administrator (first deploy only) ──────────────────────────
    # A fresh instance has an empty users table and no way in: the app has no
    # public signup and no first-run flow, its user API refuses to assign
    # SUPER_ADMIN, and an invited user always lands as USER. So env.j2 hands
    # the app a first SUPER_ADMIN, which it creates at startup while the users
    # table is still empty (app: internal/bootstrap) and ignores forever after.
    #
    # The gate is "does the .env already exist", not "does the instance have
    # users": env.j2 is written with force:false, so an existing .env is never
    # rewritten and its bootstrap keys — already consumed — stay as they are.
    # That also keeps this ahead of the stack ever starting, which a live
    # database query could not be.
    - name: Check whether this client already has an .env
      ansible.builtin.stat:
        path: "{{ app_dir }}/.env"
      register: client_env

    # skip_admin_bootstrap is set by the migrate playbooks, which import this
    # play to build the account and then DROP/restore the database over it. A
    # bootstrapped admin would be wiped by that restore, so creating one is
    # pointless — and printing its password would be a lie, since the restored
    # dump brings the real users. The migrated instance is not empty; it only
    # looks empty at this point in the run.
    - name: Set the first-admin fact
      ansible.builtin.set_fact:
        needs_admin: >-
          {{ (not client_env.stat.exists) and not (skip_admin_bootstrap | default(false)) }}

    # The bootstrap keys env.j2 writes are inert on an app build that predates
    # internal/bootstrap: the instance would come up with no admin, and this
    # play would still print a password that could never log in. Refuse instead
    # — a source tree that cannot honour the .env is a rollout ordering
    # mistake, not a client problem. Checks the synced tree, which is what the
    # image is built from two tasks below.
    - name: The synced app source must support the admin bootstrap
      ansible.builtin.stat:
        path: "{{ app_dir }}/octbase-api/internal/bootstrap/bootstrap.go"
      register: app_bootstrap_pkg
      when: needs_admin | bool

    - name: App source must be new enough to create the first admin
      ansible.builtin.assert:
        that: app_bootstrap_pkg.stat.exists
        fail_msg: >-
          The app source in {{ app_dir }} has no internal/bootstrap package, so
          it would ignore the OCTBASE_BOOTSTRAP_ADMIN_* keys and come up with no
          way to log in. Point octbase_src at a release that includes the admin
          bootstrap and re-run.
      when: needs_admin | bool

    # The ledger's contact becomes the first SUPER_ADMIN's login, so a blank or
    # malformed one is a provisioning stop, not a cosmetic gap: env.j2 writes the
    # email only when the hash is set, so a blank contact produces a
    # half-configured bootstrap (blank email + real hash) and the API refuses to
    # start on the still-empty installation — a stack that builds, deploys and
    # then crash-loops. Failing here instead costs nothing: this is still ahead
    # of the image build.
    #
    # Deliberately gated on needs_admin rather than asserted in the pre_tasks
    # block with the rest of the ledger checks. Only a FIRST deploy consumes the
    # address; on every later run the .env already exists and is not rewritten,
    # and an existing client must stay updatable (seats, edition, version) even
    # if nobody ever filled its contact in. `ledger.py validate` is the loud
    # repo-side check for that case.
    - name: The ledger contact must be a usable email address
      ansible.builtin.assert:
        that: admin_email is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
        fail_msg: >-
          ledger/clients/{{ client }}.yml has contact
          '{{ client_ledger.contact | default('') }}', which is not an email
          address. It becomes the login of this instance's first SUPER_ADMIN —
          the only way into {{ fqdn }} — so it must be a real, deliverable
          mailbox the client can receive a password reset at. Set it, run
          ./ledger/ledger.py validate, commit, and re-run.
      when: needs_admin | bool

    # 24 chars from [A-Za-z0-9]: clears the app's 12-char minimum and its
    # common-password blocklist (app: internal/shared/password.go). Generated
    # on the admin machine like the secrets in the pre_tasks above — but unlike
    # those, the plaintext is never written anywhere. It is printed once at the
    # end of this play; only its bcrypt hash reaches the .env and the database.
    - name: Generate the initial admin password
      ansible.builtin.set_fact:
        gen_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      no_log: true
      when: needs_admin | bool

    - name: Check for the bcrypt module on the admin machine
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: [python3, -c, "import bcrypt"]
      register: bcrypt_probe
      changed_when: false
      failed_when: false
      when: needs_admin | bool

    - name: The admin machine must be able to hash the password
      ansible.builtin.assert:
        that: bcrypt_probe.rc == 0
        fail_msg: >-
          python3 -c 'import bcrypt' failed on the admin machine — install it
          (apt install python3-bcrypt, or pip install bcrypt) and re-run.
          It is needed on a client's FIRST deploy only, to hash the initial
          admin password for {{ fqdn }}.
      when: needs_admin | bool

    # Cost 12 matches the app's own hashes. python3's bcrypt emits $2b$ where
    # the app emits $2a$; the Go bcrypt the API verifies with checks only the
    # major version, so a $2b$ hash logs in normally.
    - name: Hash the initial admin password
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import bcrypt, sys
            sys.stdout.write(bcrypt.hashpw(sys.argv[1].encode(), bcrypt.gensalt(12)).decode())
          - "{{ gen_admin_password }}"
      register: admin_hash
      changed_when: false
      no_log: true
      when: needs_admin | bool

    - name: Set the initial admin hash for the .env template
      ansible.builtin.set_fact:
        gen_admin_password_hash: "{{ admin_hash.stdout | trim }}"
      no_log: true
      when: needs_admin | bool

    - name: Write .env (first deploy only — holds the generated secrets)
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0600"
        force: false
      no_log: true

    - name: Sync ledger-managed settings into .env
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: OCTBASE_EDITION, value: "{{ client_ledger.edition | upper }}" }
        - { key: OCTBASE_OPTION_JIRA_IMPORT, value: "{{ 'true' if (client_ledger.jira_import | default(false)) else 'false' }}" }
        - { key: OCTBASE_MAX_USERS, value: "{{ client_ledger.max_users }}" }
        - { key: OCTBASE_APP_VERSION, value: "{{ client_ledger.app_version | default(octbase_version) }}" }
      notify: Restart stack

    # The port block was historically written once by env.j2 and never
    # re-synced, so an app-repo change to a port MAPPING could not reach an
    # existing client: the stack then failed to start with an invalid port
    # format and the .env had to be hand-fixed (D20 on postgres/API across
    # v1.0.7, D22 on the frontend across v18 — same bug, three ports). These
    # four keys carry no secrets and are pure ledger/platform facts, so they
    # are re-applied like the blocks above. FRONTEND_BIND_ADDR is not
    # cosmetic: the compose default is 0.0.0.0 (right for a standalone stack,
    # which is its own public entry), and a client frontend must stay on
    # loopback behind the edge proxy — that is C9.
    - name: Sync port bindings into .env
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: FRONTEND_BIND_ADDR, value: "127.0.0.1" }
        - { key: FRONTEND_PORT, value: "{{ client_ledger.ports.frontend }}" }
        - { key: API_PORT, value: "{{ client_ledger.ports.api }}" }
        - { key: POSTGRES_PORT, value: "{{ client_ledger.ports.postgres }}" }
      notify: Restart stack

    # Platform-wide values from group_vars would otherwise only ever reach a
    # client on its FIRST deploy (the .env template is never overwritten) —
    # changing e.g. the SMTP relay must propagate to existing clients too.
    - name: Sync platform-managed settings into .env
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: OCTBASE_TRUSTED_PROXIES, value: "{{ octbase_trusted_proxies }}" }
        - { key: OCTBASE_SMTP_HOST, value: "{{ smtp_host }}" }
        - { key: OCTBASE_SMTP_PORT, value: "{{ smtp_port }}" }
        - { key: OCTBASE_SMTP_FROM, value: "{{ smtp_from }}" }
        - { key: OCTBASE_SMTP_USER, value: "{{ smtp_user }}" }
        - { key: OCTBASE_AUDIT_RETENTION_DAYS, value: "{{ audit_retention_days }}" }
        - { key: OCTBASE_ACTIVITY_RETENTION_DAYS, value: "{{ activity_retention_days }}" }
      notify: Restart stack

    - name: Sync SMTP password into .env
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^OCTBASE_SMTP_PASS="
        line: "OCTBASE_SMTP_PASS={{ smtp_pass }}"
      no_log: true
      notify: Restart stack

    - name: Build container images (first run takes several minutes)
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.command:
        cmd: podman-compose -f podman-compose.yml -f podman-compose.client.yml build
        chdir: "{{ app_dir }}"
      changed_when: false
      timeout: 3600

    - name: Ensure systemd user dir exists
      ansible.builtin.file:
        path: "{{ home_dir }}/.config/systemd/user"
        state: directory
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0755"

    - name: Install systemd user unit
      ansible.builtin.template:
        src: octbase.service.j2
        dest: "{{ home_dir }}/.config/systemd/user/octbase.service"
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0644"
      notify: Restart stack

    - name: Enable and start the stack
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.systemd_service:
        name: octbase
        scope: user
        daemon_reload: true
        enabled: true
        state: started

    - name: Flush handlers (apply pending restart before health check)
      ansible.builtin.meta: flush_handlers

    - name: Wait for API health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ client_ledger.ports.api }}/health"
        status_code: 200
      register: health
      retries: 30
      delay: 5
      until: health.status == 200

    - name: Ensure registry/edge dirs exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ clients_registry_dir }}"
        - "{{ edge_snippet_dir }}"

    - name: Register client for monitoring
      ansible.builtin.template:
        src: client-registry.conf.j2
        dest: "{{ clients_registry_dir }}/{{ client }}.conf"
        mode: "0644"

    - name: Write edge proxy vhost snippet
      ansible.builtin.template:
        src: caddy-vhost.j2
        dest: "{{ edge_snippet_dir }}/{{ client }}.caddy"
        mode: "0644"
      # Writing the file was never enough: Caddy serves the config it loaded,
      # and nothing here reloaded it. Measured 2026-08-04 (register D30) — the
      # edge had been running a config no file on disk described since
      # 2026-08-03 19:02, because Ansible rewrote beyags.caddy and demo.caddy
      # while Caddy had been up since 2026-08-02 14:50. The visible symptom was
      # that both clients kept writing access logs their on-disk vhosts said to
      # skip, tokens included. A template fix that is never loaded is not a fix.
      notify: Reload edge Caddy

    - name: Manual follow-up steps
      ansible.builtin.debug:
        msg:
          - "Instance {{ fqdn }} is up (API /health 200 on 127.0.0.1:{{ client_ledger.ports.api }})."
          - "1) DNS (manual): create A/AAAA record {{ fqdn }} -> this host."
          - "2) Edge proxy: snippet written to {{ edge_snippet_dir }}/{{ client }}.caddy —"
          - "   ensure the edge Caddyfile has 'import {{ edge_snippet_dir }}/*.caddy', then reload it."
          - "3) Verify: curl -s https://{{ fqdn }}/health"
          - "4) First login: see the admin credentials printed below (first deploy only)."

    # Last task in the play, deliberately: this is the only time the password
    # is ever shown. It is not recoverable afterwards — only the bcrypt hash
    # is stored. If it is lost, delete the admin row and re-run this playbook
    # to mint a new one.
    - name: Initial admin credentials — store these now
      ansible.builtin.debug:
        msg:
          - "Initial SUPER_ADMIN for {{ fqdn }} — shown once, not recoverable:"
          - "  login:    {{ admin_email }}"
          - "  password: {{ gen_admin_password }}"
          - "Hand these to the client over a secure channel (not email), and have"
          - "them change the password after first login."
      when: needs_admin | bool

  handlers:
    - name: Restart stack
      become_user: "{{ linux_user }}"
      environment: "{{ user_env }}"
      ansible.builtin.systemd_service:
        name: octbase
        scope: user
        daemon_reload: true
        state: restarted

    # Validate before reloading: this is the shared edge, so a broken snippet
    # would take every tenant's vhost down at once, not just this client's.
    # `caddy validate` parses the whole imported set and fails without touching
    # the running server; the reload itself is graceful (no dropped connections)
    # and is a no-op for every vhost whose file did not change.
    # Two handlers on one topic rather than a block: handlers run in definition
    # order for a `listen` topic, so validation always precedes the reload.
    - name: Validate the edge configuration
      listen: Reload edge Caddy
      ansible.builtin.command:
        cmd: caddy validate --config /etc/caddy/Caddyfile
      changed_when: false

    - name: Reload the edge
      listen: Reload edge Caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: reloaded

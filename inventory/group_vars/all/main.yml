# Platform-wide defaults for all Octbase client instances.
# Per-client values live in ledger/clients/<name>.yml — not here.

# Public base domain; a client "acme" is served at acme.octbase.io.
#
# Changed on 2026-08-06 (the domain rename). Every per-client playbook builds
# fqdn = "{{ client }}.{{ base_domain }}", which feeds the edge vhost
# (caddy-vhost.j2), the instance env (env.j2 → OCTBASE_CORS_ORIGIN and
# OCTBASE_APP_URL), the registry conf and the unit descriptions. So a run
# against an existing client MOVES it to the new hostname; it is not a
# cosmetic edit.
#
# Before rolling any client over, confirm <client>.octbase.io resolves to the
# fleet host. octbase.io has a wildcard CNAME to the registrar, so a missing
# A record does NOT fail loudly — it silently lands on registrar parking and
# the edge's ACME challenge for that name cannot complete.
base_domain: octbase.io

# Inventory host a client runs on when its ledger entry has no `host:` field
# (must be a name from inventory/hosts.yml). Per-client playbooks scope
# themselves to the client's host and no-op on every other one.
#
# prod01, not dev01: new clients belong on the pure fleet server. dev01 also
# takes ledger clients, but placing one there is a decision the operator makes
# explicitly — in the ledger entry, or by answering create-instance.yml's
# ledger dialog. Renamed from `prod` on 2026-08-07 with the prod01/dev01 split.
default_client_host: prod01

# Path ON THE ADMIN MACHINE to a checkout of the app repo
# (frasseck/octbase-app.git) at the release you want to deploy. The create
# playbook rsyncs this working tree AS-IS to the client account — make sure
# it is on the released commit with a clean `git status` before rolling out.
octbase_src: "{{ lookup('env', 'HOME') }}/Apps/octbase"

# The app repo, and the git-based deploy source used by sync-instance.yml
# (as opposed to create-instance.yml's octbase_src working-tree rsync).
# sync-instance clones/updates octbase_branch into octbase_git_cache ON THE
# ADMIN MACHINE, then rsyncs that tree to the client — the production host
# never talks to GitHub. Override the branch per run: -e octbase_branch=...
#
# frasseck/octbase-app.git is the product repo (re-baselined 2026-08-02).
# Point this at nothing else: a retired predecessor repository can still exist,
# still resolve over SSH and still carry the same tags, in which case aiming
# here at the wrong one fails silently — the provision succeeds and ships stale
# code. Confirmed by Lars 2026-08-04.
octbase_repo: "git@github.com:frasseck/octbase-app.git"
octbase_branch: main
octbase_git_cache: "{{ lookup('env', 'HOME') }}/.cache/octbase-service/octbase"

# Clone ON THE ADMIN MACHINE that create-instance.yml deploys clients from: the
# release tag app_version selects, checked out fresh per run. Kept separate from
# octbase_git_cache because that one is a single-branch clone for
# sync-instance's branch deploys, and a single-branch clone cannot fetch tags.
octbase_release_cache: "{{ lookup('env', 'HOME') }}/.cache/octbase-service/octbase-releases"

# Default OCTBASE_APP_VERSION when a ledger entry has no app_version. This is
# not just a stamp: create-instance deploys the app repo tag v<version>, so the
# value selects the code AND labels it, and the two cannot drift apart (C4).
# Every value used here or in a ledger app_version must exist as a tag in
# octbase_repo and as a dated release entry in the app repo's CHANGELOG.md.
#
# 1.0.1, not 1.1.0, since 2026-08-04. The stamps read 1.1.0 while octbase_repo
# named a retired predecessor repository, where v1.1.0 existed — against the
# current repo that tag does not exist at all, so create-instance and
# set-version would both refuse every client. 1.0.1 is the only tag
# octbase-app carries, and it is what beyags and demo actually report at
# /api/v1/version, so this is the stamps catching up with the fleet rather
# than a downgrade. Raise it when the app repo tags its next release.
#
# 1.0.2 since 2026-08-08 — octbase-app tagged v1.0.2 (annotated e0c5e04 ->
# 58560b6) with a dated CHANGELOG entry, so C4 and C13 are both satisfied.
# This is the FLEET DEFAULT only: every active client pins its own app_version,
# and all four are still on 1.0.1. Rolling them to 1.0.2 is a separate
# decision — bump the ledger entry, then re-run create-instance.yml per client.
octbase_version: "1.0.2"

# SMTP relay for outgoing app mail (invitations, password resets,
# notifications). Until 2026-08-04 smtp_host was empty, which makes the API log
# mail to stdout — so no client instance could send anything, and a locked-out
# user's reset link went to a container's log. That is what reset-user-password.yml
# exists to work around.
#
# This is the same All-Inkl relay the marketing site's contact-form mailer uses
# (~/credentials/.env.octbase-web, WEB_SMTP_*), which the readiness plan nominates for
# exactly this. Verified 2026-08-04 from the production host: STARTTLS offered,
# AUTH accepted, and MAIL FROM <noreply@beyags.com> accepted — the relay does
# not require the envelope sender to equal the authenticated mailbox, so
# smtp_from stays the app's own no-reply address.
#
# ONE credential now serves the marketing form AND every client instance's
# transactional mail. Rotating it therefore touches both; the rotation itself
# has been open since 2026-07-10 (register §2.1). Splitting the app onto its own
# mailbox is the better end state — this is the pragmatic step that gets mail
# working now.
#
# The password is the one secret here and is NOT in this file: it comes from
# vault_smtp_pass in the ansible-vault-encrypted vault.yml beside this file
# (see vault.yml.sample). Without that vault the relay stays unauthenticated,
# which this relay rejects — so mail fails loudly rather than silently
# disappearing, and that is the intended failure mode.
smtp_host: "v091380.kasserver.com"
smtp_port: 587
smtp_from: noreply@octbase.io
smtp_user: "m080f437"
smtp_pass: "{{ vault_smtp_pass | default('') }}"

# CIDRs whose X-Forwarded-For the API honors (the stack's own frontend Caddy
# plus the edge proxy). 10.89.0.0/16 is the default rootless-podman network
# range — verify with `podman network inspect octbase_default` in a client
# account and tighten if needed.
octbase_trusted_proxies: "10.89.0.0/16"

# GDPR retention windows (days) applied to every client stack.
audit_retention_days: 365
activity_retention_days: 365

# ── Resources & disk (per client account) ─────────────────
# Platform defaults for the systemd user-slice caps applied to every client
# account (all containers + image builds count against them). A ledger entry
# overrides individual keys via its `resources:` block; apply changes with
# create-instance.yml or, without a redeploy, set-resources.yml.
client_default_resources:
  memory_max: 2G     # systemd MemoryMax
  cpu_quota: 200%    # systemd CPUQuota (100% = one core)
  tasks_max: 512     # systemd TasksMax
# Disk quota (GB) when a ledger entry has no disk_quota_gb. Enforced via
# filesystem user quota where available; always monitored (alert below).
default_disk_quota_gb: 10
# The fleet monitor flags a client DEGRADED (state-change mail) when its
# home directory reaches this percentage of its disk quota.
disk_alert_pct: 90

# ── Fleet backups (per host, root-driven; install-backup.yml) ─
# Where backup-fleet.sh writes per-client dumps + file archives on each host.
fleet_backup_root: /var/backups/octbase/fleet
# Days to keep nightly per-client backups.
backup_retention_days: 14
# Postgres image for the mandatory restore test — major version must be >= the
# clients' server major (contract C11; keep in step with the app compose).
#
# Pinned to the EXACT version the client stacks run, not the major tag. This
# value is written into /etc/octbase/backup.conf, which backup-fleet.sh sources
# BEFORE applying its own default — so whatever stands here wins, and until
# 2026-08-04 it was ":18", silently overriding the exact pin both backup scripts
# had deliberately adopted (and documented at length). A floating major tag that
# is already cached never re-pulls, so it can fall behind the servers without
# anything saying so, and the guarantee C11 exists to make — restore client >=
# source server — quietly stops holding. The claude-account job showed the shape
# of that failure on 2026-08-02: "restore-test instance did not become ready",
# and no dump for that day.
#
# Bump this together with the server upgrade, not after it.
backup_test_image: "registry.access.redhat.com/hi/postgresql:18.4"
# Optional off-host sync, run after every backup (its failure fails the run) —
# e.g. "rclone sync /var/backups/octbase/fleet crypt-remote:octbase-backups".
# Empty disables the sync (readiness plan B1 stays open until this is set).
backup_offhost_cmd: ""

# ── Monitoring ────────────────────────────────────────────
# Mail recipient for state-change alerts. "" disables mail deliberately; state
# changes are always logged to the journal either way.
#
# Two things have to be true for an alert to arrive, and until 2026-08-04
# neither was: this had to name a recipient, and the host had to have a
# `sendmail`. There was no MTA at all, so setting only this would have read as
# a fix and delivered nothing — monitor-all.sh probes for the binary and skips
# silently when it is missing (register D28). install-monitoring.yml now
# installs msmtp and asserts the relay is usable, so the half-configured state
# cannot be installed.
#
# Mail goes through the same relay as client transactional mail, whose password
# lives in the vault. Until vault.yml exists (OCT-23) install-monitoring.yml
# will REFUSE to run with this set — deliberately: the alternative is a monitor
# that looks armed and is not. Opt out explicitly with -e alert_email='' if you
# need to reinstall the monitor before the vault is in place.
alert_email: "lars@beyags.com"
# Also probe https://<name>.<base_domain>/health through the public edge
# (global default; a client whose DNS/edge is still pending can opt out via
# monitor_edge_probe: false in its ledger file).
edge_probe: true

# ── AppArmor (per host; setup-host.yml) ───────────────────
# Every fleet host gets the profiles in playbooks/templates/apparmor/ laid down
# in /etc/apparmor.d/ and loaded. What each is for, and which of them anything
# actually wears, is documented in playbooks/vars/apparmor-profiles.yml.
#
# Mode for the two root-run fleet scripts (monitor-all.sh, backup-fleet.sh),
# which are attached by executable path. enforce: their failure is loud (a
# failed unit, a missing alert) and contained to this repo's own components.
apparmor_mode_platform: enforce
# Attach the edge proxy's profile at all, via a caddy.service drop-in.
#
# OFF, and not out of caution: on 2026-08-07 the first real run turned it on and
# dev01's edge went DOWN. caddy.service is Type=notify; under the drop-in it
# never signalled readiness, systemd SIGKILLed it at the start timeout, and
# test.octbase.io and octbase.io stopped answering until the drop-in was removed
# by hand. The profile was in COMPLAIN mode, which permits everything and only
# logs, so the mechanism is not understood — see register §2.19a. Until it is,
# this control does not get to be on by default.
#
# The play now reverts the drop-in and restarts caddy unconfined if it will not
# come up, so turning this on can no longer strand the edge — but do it one host
# at a time and watch it:
#   -e apparmor_confine_edge=true -e target_host=dev01
apparmor_confine_edge: false
# Mode the edge profile is loaded in, when it is attached at all. complain
# permits everything and logs; read `journalctl -k | grep apparmor=` for a
# while, add what is genuinely missing to
# /etc/apparmor.d/local/octbase-edge-caddy, then consider enforce.
apparmor_mode_edge: complain
# Mode for the six container profiles. They are loaded but attached to nothing
# (see client_apparmor below), so this only matters once something wears them —
# and the first thing to wear an untested profile should be observing it.
apparmor_mode_containers: complain

# Wire the per-container profiles into client stacks (podman-compose.client.yml
# grows a security_opt for each service). OFF, and it is not an oversight:
#
# rootless podman cannot apply an AppArmor profile. From inside its user
# namespace securityfs is not mounted, so `podman info` reports
# AppArmorEnabled=false and `--security-opt apparmor=<name>` fails with
# "Apparmor is not enabled on this system"; containers/common also rejects
# profiles in rootless mode outright. Client stacks are rootless by design —
# one Linux account per tenant is the whole tenancy model — so turning this on
# needs a runtime that has changed. create-instance.yml probes the client's own
# podman and REFUSES rather than deploying a stack whose compose file claims a
# confinement the runtime dropped on the floor.
client_apparmor: false

# ── Conventions (rarely changed) ──────────────────────────
# Linux account prefix; client "acme" runs as user "oct-acme".
client_user_prefix: "oct-"
# Where the app source + .env + data live inside the client account.
client_app_subdir: octbase
# Host-side registries maintained by the playbooks.
edge_snippet_dir: /etc/octbase/edge
clients_registry_dir: /etc/octbase/clients.d
backup_dir: /var/backups/octbase
# The root-managed edge reverse proxy's config. Only migrate-instance.yml
# edits it (snippet import + retiring a moved domain's hardcoded vhost);
# everything else just generates snippets for it.
edge_caddyfile: /etc/caddy/Caddyfile

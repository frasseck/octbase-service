# The hosts that run Octbase stacks. One entry per server; a client's ledger
# entry pins it to one of these names via its `host:` field (default:
# default_client_host in group_vars). Adjust ansible_host to the real server
# address (the playbooks are run from a local admin machine and connect over
# SSH).
#
# Adding a server = add it here, then:
#   ansible-playbook playbooks/setup-host.yml -e target_host=<name>
#   ansible-playbook playbooks/install-monitoring.yml
#   ansible-playbook playbooks/install-backup.yml
# setup-host.yml does what this comment used to leave to hand-work: the
# baseline packages, sshd/firewall/fail2ban, and the root edge Caddy with its
# `import /etc/octbase/edge/*.caddy` line. Then place clients on the host via
# `host:` in their ledger entries (docs/fleet-concept.md; runbook in the
# README, "Add a host to the fleet") — or let create-instance.yml's ledger
# dialog ask, which offers exactly the names below.
#
# You write the name and ansible_host; setup-host.yml writes the rest. After
# it provisions a host it records that host's `ansible_user` (the account it
# was provisioned from) and `ansible_port` (1012 — it moves sshd there) into
# the entry below, between markers naming the host. Commit that change: it is
# how every other playbook then reaches the server. Editing inside those
# markers is pointless, the next run rewrites it; edit the prompts instead
# (`-e setup_user=…`) and re-run.
#
# A host this repo did NOT provision has neither key, and connects as whatever
# your `ssh <host>` already resolves to, on port 22. Root login is refused
# everywhere; `become: true` (set at each play) elevates via sudo, so that
# account needs passwordless sudo or a run with --ask-become-pass.
octbase_hosts:
  hosts:
    # ── The fleet server ──────────────────────────────────────────────────
    # Runs client stacks and nothing else. This is where new clients belong
    # (default_client_host in group_vars/all/main.yml), and what
    # setup-host.yml alone provisions — no delta playbook, no extra tenants.
    #
    # Both entries name a host rather than a bare address on purpose: this is
    # what Ansible SSHes to, and an address that moves should not mean editing
    # the inventory. Unrelated to base_domain — that is the product's public
    # suffix, this is a connection address.
    prod01:
      ansible_host: prod01.octbase.io

    # ── The development server ────────────────────────────────────────────
    # A standard fleet server that additionally carries the `claude`
    # development account. Provisioned by setup-host.yml, then
    # setup-ops-host.yml for that account (playbooks/setup-ops-host.yml).
    # Carries ledger clients like any other host.
    #
    # Note dev01.octbase.io resolves publicly to the host, but ON the host
    # itself /etc/hosts maps the same name to 127.0.1.1 (setup-host.yml writes
    # that line). So this entry is correct from an admin machine and would be a
    # loopback from the box itself — which is not how the playbooks are run.
    dev01:
      ansible_host: dev01.octbase.io

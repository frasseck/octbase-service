notes: >-
  Offboarded 2026-08-04 on Lars's instruction. Never provisioned: no
  oct-educaswiss account was ever created, educaswiss.octbase.io never got DNS or
  an edge snippet, and no contact email was ever supplied — open since
  2026-07-27 while the entry still read status active. There was therefore
  nothing on the host to remove and remove-instance.yml was not run; this is a
  ledger-only offboarding. The file is kept as the historical record, per the
  README's offboarding rule. The stale monitor_edge_probe: false was dropped
  with this change — it existed only to silence the edge probe until DNS went
  live, which now never happens. The port block 8140/8141/8142 stays reserved:
  ledger.py allocates around every entry regardless of status, so a future
  client will not be handed these ports.
